- id: swisstopo-denivele-schwarzsee-fr
  lang: fr
  category: swisstopo_feedback
  question: Tu peux montrer les dénivelés ?
  history:
    - role: user
      content: Affiche les itinéraires de randonnée dans la région de Schwarzsee
    - role: assistant
      content: Voici les itinéraires de randonnée dans la région du Schwarzsee.
  user_intent: >-
    Elevation profiles for the routes shown in the previous turn. No profile tool exists in
    the catalogue, though geo.admin.ch's profile.json does, so the answer says so and
    invents no ascent or descent figures. Judged. Flips to must_call_tool once a tool
    exists.
  expect:
    must_not_fail_tools: true
    answer_lang: fr
    judge: true

# Counter-cases for the disambiguation rule. Without these, a prompt that asks "canton or
# commune?" about everything would score well on swisstopo-unesco-bern-de while being
# useless - over-asking is a tracked failure mode with its own stage (docs/evals.md).

- id: swisstopo-no-overclarify-kanton-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir alle UNESCO Welterbe Kulturstätten im Kanton Bern
  user_intent: >-
    The request names the canton, so asking which level is meant is over-clarification.
  expect:
    must_not_clarify: true
    must_call_tool: [filter_features]
    answer_lang: de

- id: swisstopo-no-overclarify-stadt-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir alle UNESCO Welterbe Kulturstätten in der Stadt Bern
  user_intent: >-
    The request names the city, so asking is over-clarification. Also exercises "Stadt"
    becoming place_kind rather than part of the name.
  expect:
    must_not_clarify: true
    must_call_tool: [filter_features]
    answer_lang: de
