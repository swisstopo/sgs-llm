AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SGS LLM agent backend — ECS cluster, task definition and Fargate service.
  Deployed AFTER backend-foundation.yaml and after a first image exists in ECR
  (a service cannot start from an empty repository). Routine code deploys do not
  touch this stack: CI registers a new task definition revision and rolls the
  service. See docs/deployment.md#backend-deployment.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Wiring }
        Parameters: [FoundationStackName, ClusterName, BackendName, ProjectTag]
      - Label: { default: Task sizing }
        Parameters: [TaskCpu, TaskMemory, DesiredCount, ImageTag, ContainerPort]
      - Label: { default: Backend configuration }
        Parameters:
          - PrimaryModelId
          - SecondaryModelId
          - SecondaryModelRegion
          - BedrockRegion
          - PublicBaseUrl
          - McpServerUrl
          - ServiceConnectNamespace
          - McpReadTimeoutSeconds
          - LogLevel
      - Label: { default: Limits and optional key }
        Parameters:
          - ApiKey
          - TurnTimeoutSeconds
          - RateLimitMessagesPerMinute
          - MaxConnectionsPerIp

Parameters:
  FoundationStackName:
    Type: String
    Default: sgs-llm-backend-foundation
    Description: Stack name whose exports this service consumes.
  ClusterName:
    Type: String
    Default: sgs-llm
    Description: >-
      ECS cluster name. Must match the cluster in the foundation stack's deploy
      role policy, otherwise CI cannot roll the service.
  BackendName:
    Type: String
    Default: sgs-llm-backend
    Description: Service, task family and container name. Must match the deploy role policy.
  ProjectTag:
    Type: String
    Default: sgs-llm-poc
  TaskCpu:
    Type: String
    Default: '4096'
    AllowedValues: ['512', '1024', '2048', '4096', '8192', '16384']
    Description: Fargate task CPU units (4096 = 4 vCPU).
  TaskMemory:
    Type: String
    Default: '8192'
    Description: >-
      Task memory in MiB. Must be a combination Fargate allows for the chosen CPU
      (4096 CPU permits 8192-30720 in 1024 steps).
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: >-
      Running tasks. 1 for the pilot (autoscaling deliberately off); set 0 to
      park the service without deleting anything.
  ImageTag:
    Type: String
    Default: latest
    Description: >-
      ECR image tag to run. CI deploys by immutable commit sha and does not
      update this stack, so it only matters for the initial create.
  ContainerPort:
    Type: Number
    Default: 8787
    Description: Must match the foundation stack's target group port.
  PrimaryModelId:
    Type: String
    Default: eu.anthropic.claude-sonnet-4-6
    Description: >-
      Bedrock model or EU inference profile id for the primary agent model.
      Verify against `aws bedrock list-inference-profiles` before deploying.
  SecondaryModelId:
    Type: String
    Default: ''
    Description: >-
      Second model for side-by-side evaluation. Resolved from the account at
      deploy time; empty disables it.
  SecondaryModelRegion:
    Type: String
    Default: ''
    Description: >-
      Region for the secondary model, when it differs from BedrockRegion. The
      pilot's Mistral is only offered in-region in eu-west-1, and in-region
      on-demand is the one path an organization SCP does not block (see
      docs/llm.md). Empty means "same region as the primary".
  BedrockRegion:
    Type: String
    Default: eu-central-1
    Description: Region the Bedrock client targets for the primary model.
  PublicBaseUrl:
    Type: String
    Default: https://denpw8uo5zpkl.cloudfront.net
    Description: >-
      Public origin the browser talks to. The backend emits same-origin data URLs
      against it and accepts it as a WebSocket origin.
  McpServerUrl:
    Type: String
    Default: ''
    Description: >-
      Streamable-HTTP MCP server endpoint, and the switch that enables the chat. Empty
      means no production geodata server, so /ws/v1 accepts connections and refuses
      every turn rather than answering from the bundled stand-in (see
      docs/protocol.md). Set this to swisstopo's endpoint to turn the chat on, with no
      image change.
  ServiceConnectNamespace:
    Type: String
    Default: ''
    Description: >-
      Cloud Map namespace ARN to join — the geosearch foundation stack's NamespaceArn
      output. Required whenever McpServerUrl is a Service Connect name such as
      http://sgs-llm-geosearch:8790/mcp: that name exists only inside the namespace,
      so without this the backend resolves nothing and every tool call fails. Leave
      empty for an externally hosted MCP server, or none at all.
  ApiKey:
    Type: String
    Default: ''
    NoEcho: true
    # The browser sends this as a Sec-WebSocket-Protocol entry, which RFC 6455 requires
    # to be an HTTP token. A key containing / = , or a space makes the WebSocket
    # constructor throw, and the frontend then retries forever with no diagnostic. This
    # pattern is the token character set, so base64 has to be encoded before use.
    AllowedPattern: '^[A-Za-z0-9!#$%&''*+._`|~^-]*$'
    ConstraintDescription: >-
      Only unreserved token characters. No / = , : ; or spaces, so base64url or hex
      rather than plain base64.
    Description: >-
      Optional shared key for /ws/v1 and /feedback. Empty (the default) leaves the
      endpoints open, which is what docs/protocol.md describes. Note that the frontend
      must read this from the publicly served config.json, so it deters casual scanners
      and is NOT a security boundary - the rate limits are what protect the service.
  TurnTimeoutSeconds:
    Type: Number
    Default: 300
    Description: Wall-clock budget for one chat turn before it fails with `timeout`.
  McpReadTimeoutSeconds:
    Type: Number
    Default: 240
    Description: Read budget for one MCP request, including large artifact generation.
  RateLimitMessagesPerMinute:
    Type: Number
    Default: 20
    Description: Per-client message allowance. Every turn spends Bedrock tokens.
  MaxConnectionsPerIp:
    Type: Number
    Default: 8
    Description: Concurrent WebSocket connections allowed from one client address.
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warning, error]

Conditions:
  HasSecondaryModel: !Not [!Equals [!Ref SecondaryModelId, '']]
  HasSecondaryRegion: !Not [!Equals [!Ref SecondaryModelRegion, '']]
  HasMcpServer: !Not [!Equals [!Ref McpServerUrl, '']]
  HasServiceConnect: !Not [!Equals [!Ref ServiceConnectNamespace, '']]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName
      ClusterSettings:
        # Container Insights is billed per metric; the ALB and awslogs cover the
        # pilot's observability needs.
        - { Name: containerInsights, Value: disabled }
      Tags:
        - { Key: project, Value: !Ref ProjectTag }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref BackendName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      # Pinned: CI builds on x86 runners, so the task must not default elsewhere.
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: '${FoundationStackName}-TaskExecutionRoleArn'
      TaskRoleArn: !ImportValue
        Fn::Sub: '${FoundationStackName}-TaskRoleArn'
      ContainerDefinitions:
        - Name: !Ref BackendName
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo: !ImportValue
                Fn::Sub: '${FoundationStackName}-EcrRepositoryUri'
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          # Matches the target group's 30s deregistration delay so a rolling
          # deploy drains WebSocket conversations instead of cutting them.
          StopTimeout: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: '${FoundationStackName}-LogGroupName'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          # The deploy-time contract with the backend code. Everything here is
          # non-secret configuration; secrets come from Secrets Manager below.
          Environment:
            - { Name: PORT, Value: !Ref ContainerPort }
            - { Name: LOG_LEVEL, Value: !Ref LogLevel }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: BEDROCK_REGION, Value: !Ref BedrockRegion }
            - { Name: BEDROCK_PRIMARY_MODEL_ID, Value: !Ref PrimaryModelId }
            - Name: BEDROCK_SECONDARY_MODEL_ID
              Value: !If [HasSecondaryModel, !Ref SecondaryModelId, '']
            # Two models, two regions: the primary is reached through an EU
            # inference profile, the secondary in-region where it is hosted.
            - Name: BEDROCK_SECONDARY_REGION
              Value: !If [HasSecondaryRegion, !Ref SecondaryModelRegion, !Ref BedrockRegion]
            - Name: FEEDBACK_TABLE
              Value: !ImportValue
                Fn::Sub: '${FoundationStackName}-FeedbackTableName'
            - Name: CONVERSATION_TABLE
              Value: !ImportValue
                Fn::Sub: '${FoundationStackName}-ConversationTableName'
            - Name: FEEDBACK_TTL_DAYS
              Value: !ImportValue
                Fn::Sub: '${FoundationStackName}-FeedbackTtlDays'
            - Name: CONVERSATION_TTL_DAYS
              Value: !ImportValue
                Fn::Sub: '${FoundationStackName}-ConversationTtlDays'
            - Name: DATA_LAYER_BUCKET
              Value: !ImportValue
                Fn::Sub: '${FoundationStackName}-DataLayerBucketName'
            - { Name: PUBLIC_BASE_URL, Value: !Ref PublicBaseUrl }
            - { Name: ALLOWED_ORIGINS, Value: !Ref PublicBaseUrl }
            - Name: MCP_SERVER_URL
              Value: !If [HasMcpServer, !Ref McpServerUrl, '']
            - { Name: MCP_READ_TIMEOUT_SECONDS, Value: !Ref McpReadTimeoutSeconds }
            - { Name: API_KEY, Value: !Ref ApiKey }
            - { Name: TURN_TIMEOUT_SECONDS, Value: !Ref TurnTimeoutSeconds }
            - { Name: RATE_LIMIT_MESSAGES_PER_MINUTE, Value: !Ref RateLimitMessagesPerMinute }
            - { Name: MAX_CONNECTIONS_PER_IP, Value: !Ref MaxConnectionsPerIp }
          Secrets:
            # Injected as an environment variable at task start; the value never
            # appears in the task definition, the repo, or CI logs.
            - Name: MCP_SERVER_TOKEN
              ValueFrom: !Sub
                - '${SecretArn}:MCP_SERVER_TOKEN::'
                - SecretArn: !ImportValue
                    Fn::Sub: '${FoundationStackName}-BackendSecretArn'
      Tags:
        - { Key: project, Value: !Ref ProjectTag }

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref BackendName
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: true
      PropagateTags: SERVICE
      # Give a new task time to boot before the ALB verdict counts against it.
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # A task that never goes healthy rolls back to the previous definition
        # instead of leaving the service down — the safety net for deploys that
        # happen while nobody is watching.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # ENABLED because the account forbids creating a NAT gateway, so this is
          # the only route to ECR / Bedrock / DynamoDB. Nothing can reach the task
          # inbound: its security group admits the ALB security group alone.
          AssignPublicIp: ENABLED
          Subnets: !Split
            - ','
            - !ImportValue
                Fn::Sub: '${FoundationStackName}-ServiceSubnetIds'
          SecurityGroups:
            - !ImportValue
                Fn::Sub: '${FoundationStackName}-TaskSecurityGroupId'
      # Client side of Service Connect: no Services block, so this task publishes
      # nothing and only gains the ability to resolve names in the namespace. The
      # ALB path below is untouched — inbound traffic still lands on the container
      # port directly; only outbound calls to namespace names go via the sidecar.
      ServiceConnectConfiguration: !If
        - HasServiceConnect
        - Enabled: true
          Namespace: !Ref ServiceConnectNamespace
        - !Ref AWS::NoValue
      LoadBalancers:
        - ContainerName: !Ref BackendName
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !ImportValue
            Fn::Sub: '${FoundationStackName}-TargetGroupArn'
      Tags:
        - { Key: project, Value: !Ref ProjectTag }

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Description: Initial revision. CI registers later revisions outside this stack.
    Value: !Ref TaskDefinition
